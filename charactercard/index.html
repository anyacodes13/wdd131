<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anya Kay Portfolio</title>
    <meta name="description" content="A character card for tracking levels and stats of a character in a role-playing game.">
    <meta name="author" content="Anya Kay">
    <title>Character Card</title>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="A character card for tracking levels and stats of a character in a role-playing game.">
    <meta property="og:url" content="https://yourURLofPage.here">
    <meta property="og:image" content="snortleblat.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="A character card for tracking levels and stats of a character in a role-playing game.">
    <meta name="twitter:image" content="snortleblat.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

    <link rel="stylesheet" href="styles/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
    <div class="card">
        <img src="snortleblat.webp" alt="Snortleblat Character Image" class="image">
        <p class="name"></p>
        <div class="stats">
            <p class="class"></p> 
            <p class="level"></p>
            <p class="health"></p>
        </div>
        <div class="buttons">
            <button class="attacked">Attacked</button>
            <button class="level-up">Level Up</button>
        </div>
    </div>
    </main>
</body>
</html>
